<!DOCTYPE html><!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陈柯宇的个人主页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 50px 40px;
    max-width: 520px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    text-align: center;
  }
  .avatar {
    width: 110px; height: 110px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 42px;
    font-weight: bold;
  }
  h1 { font-size: 26px; margin-bottom: 10px; }
  .subtitle { color: #888; font-size: 15px; margin-bottom: 26px; }
  .intro {
    font-size: 15px; line-height: 1.9;
    color: #555; text-align: left;
    background: #f7f8fc;
    padding: 18px 20px;
    border-radius: 12px;
    margin-bottom: 26px;
  }
  .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .links a {
    padding: 10px 22px;
    background: #667eea;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-size: 14px;
    transition: 0.2s;
  }
  .links a:hover { background: #5568d3; transform: translateY(-2px); }
  footer { margin-top: 28px; font-size: 12px; color: #bbb; }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">陈</div>
    <h1>陈柯宇</h1>
    <p class="subtitle">学生 / 学习者 · 安徽理工大学</p>
    <div class="intro">
      你好，我是陈柯宇。<br>
      目前正在学习 Python 编程与人工智能相关内容，<br>
      对计算机技术充满兴趣，持续在学习路上。<br>
      欢迎通过下方链接与我交流。
    </div>
    <div class="links">
      <a href="mailto:your@email.com">邮箱</a>
      <a href="https://github.com/lonelysun2006" target="_blank">GitHub</a>
      <a href="#">更多</a>
    </div>
    <footer>© 2026 陈柯宇</footer>
  </div>
</body>
</html>
